# task-tracker v1.0 — Apache 2.4 vhost config for Windows Server 2016
#
# Drop this file into C:\Apache24\conf\extra\httpd-task-tracker.conf and add
#     Include conf/extra/httpd-task-tracker.conf
# to the bottom of C:\Apache24\conf\httpd.conf, then `Restart-Service Apache2.4`.
#
# Invariants enforced here (paired with code-presence separation in apps/public/):
#   1. Admin app binds 127.0.0.1:8080 only — kernel-level loopback restriction.
#      `Require local` is belt-and-suspenders if anything else ever binds to
#      that interface.
#   2. Public app binds *:80 — reachable from the corporate LAN.
#   3. data/ and logs/ are SHARED between vhosts via SetEnv DATA_DIR / LOG_DIR.
#      Both apps read the same CSV / NDJSON files; admin writes, public reads.
#
# If the source tree is not at C:/inetpub/task-tracker, update every path below.

LoadModule php_module "C:/php/php8apache2_4.dll"
AddHandler application/x-httpd-php .php
PHPIniDir "C:/php"

Listen 127.0.0.1:8080
Listen 80

# ---------------------------------------------------------------------------
# Admin vhost — full CRUD. Loopback only.
# ---------------------------------------------------------------------------
<VirtualHost 127.0.0.1:8080>
    ServerName task-tracker-admin.local
    DocumentRoot "C:/inetpub/task-tracker/apps/admin/public"

    <Directory "C:/inetpub/task-tracker/apps/admin/public">
        AllowOverride All
        Require local
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php

        # Slim 4 front-controller: route every request that doesn't match a
        # real file through public/index.php.
        FallbackResource /index.php
    </Directory>

    SetEnv DATA_DIR "C:/inetpub/task-tracker/data"
    SetEnv LOG_DIR  "C:/inetpub/task-tracker/logs"

    ErrorLog  "C:/inetpub/task-tracker/logs/admin-error.log"
    CustomLog "C:/inetpub/task-tracker/logs/admin-access.log" combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Public vhost — read-only. LAN-reachable.
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName task-tracker.corp.local
    DocumentRoot "C:/inetpub/task-tracker/apps/public/public"

    <Directory "C:/inetpub/task-tracker/apps/public/public">
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php

        FallbackResource /index.php
    </Directory>

    SetEnv DATA_DIR "C:/inetpub/task-tracker/data"
    SetEnv LOG_DIR  "C:/inetpub/task-tracker/logs"

    ErrorLog  "C:/inetpub/task-tracker/logs/public-error.log"
    CustomLog "C:/inetpub/task-tracker/logs/public-access.log" combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Deny direct access to source / data / config from BOTH vhosts.
# DocumentRoot already excludes apps/{admin,public}/src, lib/, tools/, data/,
# logs/, vendor/, and the repo root — these blocks are defensive in case the
# DocumentRoot is ever misconfigured.
# ---------------------------------------------------------------------------
<DirectoryMatch "C:/inetpub/task-tracker/(data|logs|tools|lib|vendor|apps/[^/]+/(src|tests|vendor))">
    Require all denied
</DirectoryMatch>

<FilesMatch "(\.env|composer\.(json|lock)|phpunit\.xml|_schema_version\.txt)$">
    Require all denied
</FilesMatch>
