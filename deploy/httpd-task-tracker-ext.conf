# task-tracker v1.0 — Apache 2.4 extension config
#
# INSTALL:
#   1. Copy to C:\Apache24\conf\extra\httpd-task-tracker.conf
#   2. Add one line to the bottom of C:\Apache24\conf\httpd.conf:
#        Include conf/extra/httpd-task-tracker.conf
#   3. net stop Apache2.4 && net start Apache2.4
#
# VERIFY BEFORE INCLUDING:
#   - PHP: confirm your httpd.conf already loads mod_php, or uncomment the
#     three PHP lines below.
#   - Listen 80: if httpd.conf already has "Listen 80", remove it here to
#     avoid a duplicate-listen warning on restart.
#   - Source path: if the repo is not at C:/inetpub/task-tracker, find-replace
#     that string throughout this file.

# -- PHP (uncomment if not already loaded in httpd.conf) ---------------------
# LoadModule php_module "C:/php/php8apache2_4.dll"
# AddHandler application/x-httpd-php .php
# PHPIniDir "C:/php"

# -- Ports -------------------------------------------------------------------
# Remove "Listen 80" if httpd.conf already declares it.
Listen 80
Listen 127.0.0.1:8080

# ---------------------------------------------------------------------------
# Admin vhost — full CRUD, loopback only (127.0.0.1:8080)
# ---------------------------------------------------------------------------
<VirtualHost 127.0.0.1:8080>
    ServerName task-tracker-admin.local
    DocumentRoot "C:/inetpub/task-tracker/apps/admin/public"

    <Directory "C:/inetpub/task-tracker/apps/admin/public">
        AllowOverride All
        Require local
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    SetEnv DATA_DIR "C:/inetpub/task-tracker/data"
    SetEnv LOG_DIR  "C:/inetpub/task-tracker/logs"

    ErrorLog  "C:/inetpub/task-tracker/logs/admin-error.log"
    CustomLog "C:/inetpub/task-tracker/logs/admin-access.log" combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Public vhost — read-only, LAN-reachable (*:80)
# ---------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName task-tracker.corp.local
    DocumentRoot "C:/inetpub/task-tracker/apps/public/public"

    <Directory "C:/inetpub/task-tracker/apps/public/public">
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    SetEnv DATA_DIR "C:/inetpub/task-tracker/data"
    SetEnv LOG_DIR  "C:/inetpub/task-tracker/logs"

    ErrorLog  "C:/inetpub/task-tracker/logs/public-error.log"
    CustomLog "C:/inetpub/task-tracker/logs/public-access.log" combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Deny direct access to source, data, config from both vhosts
# ---------------------------------------------------------------------------
<DirectoryMatch "C:/inetpub/task-tracker/(data|logs|tools|lib|vendor|apps/[^/]+/(src|tests|vendor))">
    Require all denied
</DirectoryMatch>

<FilesMatch "(\.env|composer\.(json|lock)|phpunit\.xml|_schema_version\.txt)$">
    Require all denied
</FilesMatch>
